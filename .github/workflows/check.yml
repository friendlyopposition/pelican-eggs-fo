name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML and shellcheck
        run: sudo apt-get update && sudo apt-get install -y python3-yaml shellcheck
      - name: bin/check
        run: bin/check
